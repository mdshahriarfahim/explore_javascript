<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFinder — GitHub User Lookup</title>
</head>
<body>
    <header class="hero">
    <div class="brand">DevFinder</div>
    <h1>Search GitHub Developer</h1>
    <p>Enter Username — profile, stats, top repos all in one place.</p>
  </header>
    <main class="app">
    <div class="search">
      <input id="u" placeholder="e.g. torvalds" />
      <button id="b">Search</button>
    </div>

    <div id="loader" class="loader" hidden>Loading...</div>
    <div id="out" class="out"></div>
  </main>

  <footer>© DevFinder 2026 · Powered by api.github.com</footer>

  
</body>
</html>
