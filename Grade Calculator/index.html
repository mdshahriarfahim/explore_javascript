<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator - Pundra University </title>
</head>
<body>
    <header>
        <nav>
            <span>Pundra University</span><a href="#calc"> Calculator </a>
        </nav>
        <h1>Your Grade — in one click </h1>
        <p>Know which grade you will get based on your SSC / HSC board marks</p>
    </header>

    <section>
        <h2>Enter Marks</h2>
        <input type="number" min="0" max="100" placeholder="0 - 100" />
        <button> Show Grade</button>
        <!-- <div id="grade-output"></div> -->
    </section>

    <section>
        <h2>Grade Chart</h2>
        <ul>
            <li>100 - 80 : A+</li>
            <li>79 - 70 : A</li>
            <li>69 - 60 : B</li>
            <li>59 - 50 : C</li>
            <li>49 - 40 : D</li>
            <li>Below 40 : F</li>
        </ul>
    </section>

</body>
</html>
