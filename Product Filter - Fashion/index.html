<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendy - Fashion Store</title>

</head>
<body>
    <header class="hero">
      <nav><b>Trendy</b><span>Winter Sale – 10% off</span></nav>
      <h1>Winter Collection</h1>
      <p>Shirt, Pants, Shoes – all in one place</p>
    </header>

     <section class="filters">
      <button data-f="all" class="f active">All</button>
      <button data-f="shirt" class="f">Shirts</button>
      <button data-f="pants" class="f">Pants</button>
      <button data-f="shoes" class="f">Shoes</button>
      <label class="in-stock"><input id="stock" type="checkbox" checked /> In-stock only</label>
    </section>


</body>
</html>
