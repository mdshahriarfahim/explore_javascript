<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCalc - Simple Calculator </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <nav><b>QuickCalc</b><a href="#calc">Try it</a></nav>
        <h1>Quick Calculation – Anytime</h1>
        <p>Get instant results for +, -, ×, and ÷!</p>
    </header>

    <section id="calc" class="card">
        <div class="row">
            <input id="a" type="number" placeholder="Enter first number">
            <select id="op">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">×</option>
                <option value="/">÷</option>
            </select>
            <input id="b" type="number" placeholder="Enter second number">
        </div>
        <button id="go">Calculate</button>
        <div id="out" class="out">= 0 </div>
    </section>

    <section class="features">
        <div><h3>Fast</h3><p>Instant result</p></div>
        <div><h3>Simple</h3><p> No signup</p></div>
        <div><h3>Free</h3><p>Always free</p></div>
    </section>

    <footer>
        &copy; QuickCalc 2026
    </footer>
    <script src="script.js"></script>
</body>
</html>
