<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bogura Restaurant - Tip Calculator</title>

</head>
<body>
    <header class="hero">
        <div class="brand">Bogura Restaurant</div>
        <h1>Bill Split Easy</h1>
        <p>Bill amount enter, tip & select – see total together</p>
    </header>

    < class="calc">
        <label> Bill (💵)
        <input id ="bill" type="number" min="0" placeholder="Enter bill amount" required>
    </label>
    <label> Tip%
        <div class="pct-row">
            <button class="pct" data-p="5">5%</button>
            <button class="pct" data-p="10">10%</button>
            <button class="pct" data-p="15">15%</button>
            <button class="pct" data-p="20">20%</button>
        </div>
    </label>

    <label>People
        <input id="people" type="number" min="1" value="1" />
    </label>

    <div id="out" class="out">
       <div class="row"><span>Tip</span><b id="tip">TK 0</b></div>
         <div class="row"><span>Total</span><b id="total">TK 0</b></div>
         <div class="row big"><span>Per Person</span><b id="each">TK 0</b></div>
        </div>
       
    </main>

    


</body>
</html>
