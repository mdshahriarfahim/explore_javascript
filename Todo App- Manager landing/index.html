<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow - Simple  Todo</title>
    <link rel="stylesheet" href="/Todo App- Manager landing/style.css"/>
</head>
<body>
    <header class="hero">
        <div class="brand">TaskFlow</div>
        <h1>Today's work, guaranteed finished </h1>
        <p>Make by deligation - infinite items add to do performant!</p>
    </header>
    <main class="app">
        <form id="f" class="composer">
            <input id="i" placeholder="write the new work" required />
            <button> + Add </button>
        </form>
        <ul id="list" class="list"></ul>
        <div class="stats"><span id="count" > 0 tasks</span> .<button id="clear">Clear done</button></div>
    </main>

    <footer>&copy; TaskFlow 2026. Tip: Do click to item text- done toggle!</footer>

    <script src="/Todo App- Manager landing/script.js"></script>
</body>
</html>
